[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anon-trader"
version = "0.1.0"
description = "ระบบเทรด BTCUSD ตามกติกาห้อง ANON: Ghost → Ω → Risk → Zen → อนุมัติ → Quant"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=1.8"]
mt5 = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=8"]

[project.scripts]
anon = "anon.cli:main"

[tool.setuptools.packages.find]
include = ["anon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
