# ANON config — คัดลอกเป็น config/anon.toml แล้วแก้
# ค่าที่มี "ต้องยืนยัน" ใบส่งมอบไม่ได้กำหนดไว้ หัวหน้า/เจ้าของต้องเคาะเอง

[levels]
a_zone_bot = 83000.0      # A bot / inv
a_zone_top = 83500.0      # A top
b_inv_ref = 84400.0       # อ้างอิงเท่านั้น ไม่ใช่ entry/stop
gray_center = 84700.0     # เทา NO CHASE
gray_half_width = 150.0   # ต้องยืนยัน: เทา = 84550–84850
tp1 = 85500.0
liq_top = 87000.0

[ghost]
stop_buffer = 50.0        # stop จริง = low ของ sweep/swing ลบค่านี้
swing_lookback = 6
breakout_expiry_bars = 12
retest_tolerance = 100.0
min_rr = 1.0              # ต้องยืนยัน

[risk]
lot = 0.01
max_lot = 0.01
risk_per_trade_pct = 0.5
daily_loss_pct = 2.0
peak_dd_warn_pct = 5.0
veto_tickets = [208190412]
veto_if_unmanaged_open = true

[zen]
max_consecutive_off_plan = 2
cooldown_bars_after_loss = 3   # ต้องยืนยัน: "ไม่ไล่คืนทุน"
restore_widened_stop = true

[omega]
unfavorable_action = "veto"    # ต้องยืนยัน: "veto" หรือ "tag"
ema_fast = 20
ema_slow = 50
atr_period = 14
shock_atr_mult = 3.0
ai_enabled = false             # true = ให้ Claude ช่วย veto (ต้องมี ANTHROPIC_API_KEY)
ai_model = "claude-opus-5"
ai_effort = "low"
ai_fail_closed = true

[execution]
mode = "live"
symbol = "BTCUSD"
magic = 7700700
approval = "manual"            # "auto" ใช้ได้เมื่อ Quant ผ่านเกณฑ์ n>=30, E[R]>0, P(edge>0)>=0.9
dry_run = true                 # false + --confirm-live + confirmed_by เท่านั้นถึงส่งออเดอร์จริง
confirmed_by = ""              # ชื่อเจ้าของ/หัวหน้าที่เคาะค่า "ต้องยืนยัน" ทั้งหมดแล้ว
deviation = 50
server_utc_offset_hours = "auto"  # อ่านจากราคาล่าสุดของโบรกเกอร์เอง (ใส่ตัวเลขได้ถ้าต้องการล็อก)
day_utc_offset_hours = 7.0     # ตัดวันตามเวลาไทย
journal_path = "journal/anon_journal.jsonl"
state_path = "state/anon_state.json"
# usdthb = 33.42               # ใส่เมื่อต้องการแปลง P/L จริงเป็นบาทในบันทึก

[auto]
# ระดับอัตโนมัติ: วาดเส้นใหม่ทุกวันจากกรอบราคา lookback_bars แท่ง H1 ล่าสุด (ใช้แท่งที่ปิดแล้วเท่านั้น)
# ค่าเป็นสัดส่วนของกรอบ (ล่าง=0, บน=1) ตั้งไว้ตรงกับรูปทรงในใบส่งมอบ: กรอบ 83000–87000 → เส้นเดิมเป๊ะ
enabled = false          # true = ใช้ระดับอัตโนมัติแทน [levels] (อินดิเคเตอร์ยังแสดง [levels] อยู่)
lookback_bars = 72
min_range_atr = 3.0      # กรอบแคบกว่านี้ × ATR = ไม่วาด ไม่เทรดวันนั้น
a_top = 0.125
b_ref = 0.35
gray_center = 0.425
gray_half = 0.0375
tp1 = 0.625
stop_buffer = 0.0125
retest_tolerance = 0.025
